name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - run: dotnet restore

      - run: dotnet build --no-restore --configuration Release

      # Les règles d'éligibilité et la projection sont des fonctions pures :
      # elles se testent sans broker, en quelques dizaines de millisecondes.
      - run: dotnet test --no-build --configuration Release --verbosity normal
